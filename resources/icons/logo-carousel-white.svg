<svg width="512" height="512" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="slideGradCleanWhite" x1="28" y1="36" x2="94" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#338399" />
      <stop offset="50%" stop-color="#40a4bf" />
      <stop offset="100%" stop-color="#66b6cc" />
    </linearGradient>
  </defs>
  <!-- Base Pure White Squircle -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="#ffffff" stroke="#d9edf2" stroke-width="1.5" />
  
  <!-- Back Slide (Soft light-blue tint, no shadow, rotated -6deg) -->
  <rect x="23" y="32" width="64" height="44" rx="8" fill="#d9edf2" stroke="#b3dae6" stroke-width="1.2" transform="rotate(-6 23 32)" />
  
  <!-- Front Active Slide Card (Centered, clean gradient, no aurora shadow, no header bar) -->
  <rect x="30" y="38" width="64" height="44" rx="8" fill="url(#slideGradCleanWhite)" />
  
  <!-- Minimalist Dashboard Wireframe -->
  <rect x="37" y="48" width="22" height="4" rx="2" fill="#ffffff" />
  <rect x="37" y="56" width="34" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.8" />
  <rect x="37" y="63" width="18" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.5" />
  
  <!-- Mini circular telemetry chart -->
  <circle cx="78" cy="60" r="8" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2" />
  <path d="M 74 61 L 77 58 L 82 63" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Live Status Beacon (Black Forest 500) -->
  <circle cx="92" cy="36" r="4.5" fill="#2ed131" />
  <circle cx="92" cy="36" r="7" stroke="#2ed131" stroke-width="1.5" stroke-opacity="0.3" fill="none" />
</svg>
