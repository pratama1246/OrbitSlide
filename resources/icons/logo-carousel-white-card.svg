<svg width="512" height="512" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Base Dark Squircle -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="#09171b" stroke="#19414d" stroke-width="1.5" />
  
  <!-- Back Slide (Soft translucent white, no shadow, rotated) -->
  <rect x="23" y="32" width="64" height="44" rx="8" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.2" transform="rotate(-6 23 32)" />
  
  <!-- Front Active Slide Card: Pure White Card -->
  <rect x="30" y="38" width="64" height="44" rx="8" fill="#ffffff" />
  
  <!-- Dark minimal dashboard lines inside white card -->
  <rect x="37" y="48" width="22" height="4" rx="2" fill="#338399" />
  <rect x="37" y="56" width="34" height="3" rx="1.5" fill="#40a4bf" />
  <rect x="37" y="63" width="18" height="3" rx="1.5" fill="#8cc8d9" />
  
  <!-- Telemetry circle -->
  <circle cx="78" cy="60" r="8" fill="#ecf6f9" stroke="#b3dae6" stroke-width="1.2" />
  <path d="M 74 61 L 77 58 L 82 63" stroke="#338399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Live Status Beacon -->
  <circle cx="92" cy="36" r="4.5" fill="#2ed131" />
  <circle cx="92" cy="36" r="7" stroke="#2ed131" stroke-width="1.5" stroke-opacity="0.3" fill="none" />
</svg>
